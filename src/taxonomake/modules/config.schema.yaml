$schema: "https://json-schema.org/draft/2020-12/schema" 
title: Community description
description: Schema for taxonomake community description configuration
type: object
properties: 
  samples:
    oneOf:
    - description: Sample reads
      type: object
      properties:
        names:
          description: Sample names
          type: array
          items:
            type: string
          minItems: 1
        
        reads1:
          description: Forward read (fastq.gz) files
          type: array
          items:
            description: Gzipped Fastq file
            type: string
          minItems: 1
        
        reads2:
          description: Reverse read (fastq.gz) files
          type: array
          items:
            type: string
          minItems: 1

        truths:
          description: Truth community profile
          type: array
          items:
            description: Tab-separated file with columns 'sample', 'coverage', 'taxonomy'
            type: string
          minItems: 1
        
        coverages:
          description: Genome-wise coverages per sample
          type: array
          items:
            description: Tab-separated file (headerless) with columns 'genome id', 'coverage'
            type: string
          minItems: 1
      required: ["names", "reads1", "reads2", "truths"]
      
      additionalProperties: false

    - description: Sample description file
      type: string
    
  genomes_list:
    oneOf:
      - description: Tab-separated file (headerless) with columns 'genome fasta', 'genome id'
        type: string

      - description: Genome list files
        type: object
        properties:
          ncbi:
            description: Tab-separated file (headerless) with columns 'genome fasta', 'accession id'
            type: string

          user:
            description: Tab-separated file (headerless) with columns 'genome fasta', 'genome id'
            type: string

        additionalProperties: False

        minProperties: 1 
  
  taxonomy:
    description: Tab-separated file (headerless) with columns 'genome id', 'taxonomy string'
    type: string
  
  classify:
    description: Genome classification tool
    type: object
    properties:
      tool:
        description: Genome Tree Database toolkit for genome taxonomic classification
        const: "gtdbtk"
        
      directory:
        description: Directory for GTDB-TK intermediate outputs
        type: string
      
      release:
        description: GTDB version
        enum: ["207"]
      
      data:
        description: Directory for downloaded GTDB-TK data
        type: string
      
    required: ["directory", "release", "data"]
    
    additionalProperties: false
  
  readsim:
    description: Tool for generating simulated reads
    type: object
    properties: 
      tool:
        description: art_Illumina simulation program for sequence read data from Illumina sequences
        const: "art"
      
      binary:
        description: Path to tool binary
        type: string
      
      read_length:
        description: Read length of simulated reads
        type: integer
      
    required: ["tool", "binary", "read_length"]

    additionalProperties: false
  
required: ["samples"]

additionalProperties: false

dependentRequired:
  gtdbtk: ["genomes_list", "taxonomy"]
  readsim: ["genomes_list", "taxonomy"]