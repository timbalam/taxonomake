samples:
  names: 
    - "small"
  reads1:
    - "tmp/small_1.fq.gz"
  reads2:
    - "tmp/small_2.fq.gz"
  # truth.tsv has named columns sample/taxonomy/coverage
  truths:
    - "tmp/truth.tsv"
  # coverages.tsv has unnamed columns otu/coverage
  coverages:
    - "coverages.tsv"

# taxonomy.tsv has unnamed columns otu/taxonomy
taxonomy: "taxonomy.tsv"

# genomes.tsv has unnamed columns path_to_fna/otu
genomes_list: "genomes.tsv"

readsim:
  tool: "art"
  binary: "art_illumina"
  read_length: 150