# taxonomy.tsv has unnamed columns taxids/taxonomy
taxonomy: "taxonomy_taxids.tsv"

# genomes_taxons.tsv has unnamed columns path_to_fna/taxids
genomes_list:
  taxon: "genomes_taxids_tmp.tsv"

samples:
  names: ["small"]
  reads1: ["tmp/small_1.fq.gz"]
  reads2: ["tmp/small_2.fq.gz"]
  # truth.tsv has named columns sample/taxonomy/coverage
  truths: ["tmp/truth.tsv"]
  # coverages has unnamed columns otu/coverage
  coverages: ["coverages.tsv"]

readsim:
  tool: "art"
  binary: "art_illumina"
  read_length: 150

