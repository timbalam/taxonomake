## Test generating reads and truth from known genomes etc. using taxids as ids
# taxonomy_taxids.tsv has unnamed columns taxid/taxonomy
taxonomy: "taxonomy_taxids.tsv"

# genomes_taxids.tsv has unnamed columns path_to_fna/taxid
genomes_list:
  taxon: "genomes_taxids.tsv"

samples:
  names: ["small"]
  reads1: ["tmp/small_1.fq.gz"]
  reads2: ["tmp/small_2.fq.gz"]
  # truth.tsv has named columns sample/taxonomy/coverage
  truths: ["tmp/truth.tsv"]
  # coverages_taxids.tsv has unnamed columns taxid/coverage
  coverages: ["coverages_taxids.tsv"]

readsim:
  tool: "art"
  binary: "art_illumina"
  read_length: 150