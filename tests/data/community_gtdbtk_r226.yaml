classify:
  tool: "gtdbtk"
  release: "226"
  directory: "tmp/genomes.gtdbtk_r226"
  data: "tmp/gtdbtk_r226_data"

# taxonomy.tsv has unnamed columns otu/taxonomy
taxonomy: "tmp/taxonomy_r226.tsv"

# genomes.tsv has unnamed columns path_to_fna/otu
genomes_list: "genomes.tsv"

samples:
  names: ["small"]
  reads1: ["reads/small_1.fq.gz"]
  reads2: ["reads/small_2.fq.gz"]
  # truth.tsv has named columns sample/taxonomy/coverage
  truths: ["truth_r226.tsv"]
  # coverages has unnamed columns otu/coverage
  coverages: ["coverages.tsv"]

readsim:
  tool: "art"
  binary: "art_illumina"
  read_length: 150

